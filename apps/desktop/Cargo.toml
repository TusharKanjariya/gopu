[package]
name = "gopu-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "gopu-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gopu-core = { path = "../../crates/gopu-core" }
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
tauri-plugin-updater = "2"
