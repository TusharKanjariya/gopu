<!doctype html>
<!-- PROTOTYPE, throwaway. Question: which original elephant animation should the Gopu key use? (11 concepts, A-K)
     Switch with ?variant=A..K or the bottom bar. Double-click to open. -->
<html lang="en"><head><meta charset="utf-8"><title>Gopu key: animation prototype</title>
<style>
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#ECEEF1;color:#1d1f23;min-height:100vh}
  .app{width:640px;margin:48px auto 0;background:#fff;border-radius:14px;box-shadow:0 8px 30px #0001;padding:22px 40px 36px}
  .hdr{display:flex;gap:10px;align-items:center;font-weight:600}.av{width:32px;height:32px;border-radius:50%;background:#7c5cff;color:#fff;display:grid;place-items:center}
  .msg{margin:18px 0 0 42px;background:#f1f3f6;border-radius:12px;padding:10px 14px;display:inline-block}
  .wrap{position:relative;width:560px;margin:90px 0 0}
  #box{position:relative;z-index:1;box-sizing:border-box;width:100%;height:46px;font:15px 'Segoe UI',system-ui,sans-serif;padding:0 16px;border-radius:10px;border:1.5px solid #cfd4db;background:#fff;outline:none}
  #box:focus{border-color:#3b82f6;box-shadow:0 0 0 3px #3b82f622}
  textarea#box{height:112px;padding:12px 16px;line-height:22px;resize:none;display:block}
  .ctrl{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;font-size:13px;color:#555}
  .wrap.has-status+.ctrl{margin-top:58px}
  .ctrl .sm{background:#f1f3f6;color:#333;font-weight:600;padding:6px 10px}.ctrl .sm.on{background:#1d1f23;color:#fff}
  .ctrl select{font:13px inherit;padding:4px}
  .ctrl button{font:600 13px inherit;border:0;border-radius:8px;padding:8px 14px;background:#E8891C;color:#fff;cursor:pointer}
  .about{font-size:13px;color:#555;line-height:1.5;margin-top:14px;max-width:560px}
  #state{position:fixed;top:12px;right:12px;font:12px ui-monospace,monospace;background:#1d1f23;color:#cfe;padding:10px 12px;border-radius:8px;white-space:pre}
  .bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;display:flex;align-items:center;gap:6px;padding:6px;box-shadow:0 6px 20px #0004;font-size:14px;z-index:9}
  .bar button{background:#333;color:#fff;border:0;border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px}#label{padding:0 12px;min-width:170px;text-align:center}#pills{display:flex;gap:4px}
  .fx{position:absolute;pointer-events:none;z-index:5;font-weight:700;line-height:1}
  svg .ear{transform-box:fill-box;transform-origin:70% 10%;transition:transform .3s}
  svg .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
  svg .trunk{transform-box:fill-box;transform-origin:0% 85%}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  @keyframes flap{50%{transform:rotate(-22deg)}}
  @keyframes wiggle{50%{transform:rotate(-12deg)}}
  @keyframes step{50%{transform:translateY(-6px)}}
  @keyframes hop{40%{transform:translateY(-14px) rotate(-4deg)}}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  @keyframes bob{50%{transform:translateY(-3px)}}
  .thinking svg .ear{animation:flap .22s infinite}
  .error svg .ear{transform:rotate(32deg)}
  /* A: perch & tightrope */
  .mA{position:absolute;z-index:2;transition:left .1s linear,opacity .25s,transform .45s cubic-bezier(.3,1.7,.5,1)}
  .mA.idle{opacity:0;transform:translateY(-50px)}
  .mA .tdown{display:none}.mA.writing .tdown{display:inline}.mA.writing .tup{display:none}
  .mA.writing .near{animation:step .26s infinite}.mA.writing .far{animation:step .26s infinite .13s}
  .mA.writing .near,.mA.writing .far{transform-box:fill-box}
  .mA.done svg{animation:hop .45s 2}.mA.error svg{animation:shake .35s 3}.mA.focused svg{animation:bob 2.4s infinite}
  /* B: peekaboo spray */
  .mB{position:absolute;z-index:0;transition:top .4s cubic-bezier(.3,1.6,.5,1),left .3s,opacity .25s}
  .mB.idle{top:14px!important;opacity:0}.mB.focused{top:-24px}.mB.thinking,.mB.writing,.mB.done{top:-52px}.mB.error{top:-16px}
  .mB.thinking .trunk,.mB.writing .trunk{animation:wiggle .3s infinite}.mB.error svg{animation:shake .3s 3}
  /* C: stretchy trunk */
  .mC{position:absolute;z-index:2;overflow:visible;pointer-events:none}
  .mC .headg{transition:opacity .3s}.mC.idle .headg{opacity:0}
  .mC.done .headg{animation:hop .45s 2;transform-box:fill-box}
  /* ---- shared by D-K: compact head (faces the field), overlays ---- */
  .ov{position:absolute;pointer-events:none;z-index:2}
  .mini{position:absolute;pointer-events:none;z-index:2;opacity:0;transform:translateY(4px);transition:opacity .2s cubic-bezier(.2,.8,.2,1),transform .2s cubic-bezier(.2,.8,.2,1)}
  .mini.on{opacity:1;transform:none}
  svg .hd{transform-box:fill-box;transform-origin:50% 70%;transition:transform .3s ease-in-out}
  svg .tr{transform-box:fill-box;transform-origin:0% 90%;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  svg .pupil{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
  .look-in .pupil{transform:translate(2.2px,1.4px)}.look-up .pupil{transform:translate(.6px,-2.2px)}.look-down .pupil{transform:translate(1.2px,2.4px)}
  .tilt .hd{transform:rotate(-8deg)}.droop .ear{transform:rotate(16deg)}
  @keyframes nod{40%{transform:rotate(7deg) translateY(1.5px)}}
  @keyframes breathe{50%{transform:translateY(-1.5px) rotate(-2deg)}}
  @keyframes twitch{0%,80%,100%{transform:none}88%{transform:rotate(-6deg)}}
  @keyframes blink1{50%{transform:scaleY(.1)}}
  .nod .hd{animation:nod .35s cubic-bezier(.25,1.4,.45,1)}
  .breathe .hd{animation:breathe 2s ease-in-out infinite}.twitch .ear{animation:twitch 2.2s ease-in-out infinite}
  .blink1 svg .eye{animation:blink1 .26s}
  .bar .p{width:26px;height:26px;padding:0;font:600 12px 'Segoe UI',system-ui;background:#2a2a2a;color:#bbb}.bar .p.on{background:#E8891C;color:#fff}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.05s!important}}
  /* ---- L-Q: full-body rig + text overlays ---- */
  .rig{position:absolute;pointer-events:none;z-index:4;transition:opacity .2s}.rig.hide{opacity:0}
  .rig svg .ck{transform-box:fill-box;transform-origin:center;transition:transform .25s cubic-bezier(.25,1.4,.45,1)}
  .rig.puff svg .ck{transform:scale(1.7)}.rig.perk .ear{transform:rotate(-14deg)}.rig.droop .ear{transform:rotate(18deg)}
  .rig.lk-r .pupil{transform:translate(3px,1.5px)}.rig.lk-d .pupil{transform:translate(2px,3.5px)}.rig.lk-u .pupil{transform:translate(1px,-3.5px)}
  .rig.walk .near,.rig.walk .far{transform-box:fill-box;animation:step .26s infinite}.rig.walk .far{animation-delay:.13s}
  .rig.shake-ears .ear{animation:flap .12s 4}
  .trk{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
  #status{position:absolute;right:0;pointer-events:none;z-index:5;background:#fff;border:1px solid #e3e6ea;border-radius:10px;box-shadow:0 4px 14px #0000000f;
    padding:6px 10px;font-size:12px;color:#444;max-width:330px;opacity:0;transform:translateY(-4px);transition:opacity .2s cubic-bezier(.2,.8,.2,1),transform .2s cubic-bezier(.2,.8,.2,1)}
  #status.on{opacity:1;transform:none}#status b{color:#B2600B}#status .ba{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin-top:4px;color:#666}
  #status .ba span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tray{position:fixed;left:16px;bottom:16px;background:#1d1f23;border-radius:10px;padding:6px 10px;color:#aaa;font-size:12px;display:flex;align-items:center;gap:8px}
</style></head><body>
<div class="app">
  <div class="hdr"><div class="av">M</div>Maya · #launch</div>
  <div class="msg">Hey! Could you review the launch deck today? Need it before Friday 🙏</div>
  <div class="wrap" id="wrap"><input id="box" placeholder="Message Maya…" autocomplete="off"></div>
  <div class="ctrl"><button id="key">Gopu key (Right Ctrl)</button>
    <label><input type="checkbox" id="fail"> make the next press fail</label>
    <label><input type="checkbox" id="slow"> slow-mo ×4</label>
    <label><input type="checkbox" id="stat" checked> status panel</label>
    <label>think <select id="think"><option value="500">0.5s</option><option value="1400" selected>1.4s</option><option value="3000">3s</option></select></label></div>
  <div class="ctrl" style="margin-top:10px">Field:
    <button class="sm" id="f1">Single line</button><button class="sm" id="f2">Multi-line</button>
    &nbsp;Fill:<button class="sm" id="s0">Empty</button><button class="sm" id="s1">Short draft</button><button class="sm" id="s2">Long draft</button><button class="sm" id="s3">Instruction</button><button class="sm" id="s4">Two paragraphs</button></div>
  <div class="about" id="about"></div>
  <div class="about"><b>Try:</b> an empty box gives a reply · type a draft like <i>ya ill check it later</i> to polish it · type <i>translate to spanish</i> to run an instruction.</div>
</div>
<div class="tray" id="tray"></div>
<div id="state"></div>
<div class="bar"><button id="prev">‹</button><span id="pills"></span><button id="next">›</button><span id="label"></span></div>
<script>
const C={m:'#E8891C',dk:'#B2600B',o:'#2B170A',lt:'#FFD29A',ck:'#F06A5E'};
const $=id=>document.getElementById(id), wrap=$('wrap');let box=$('box');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tube=(d,w,i)=>`<path d="${d}" fill="none" stroke="${C.o}" stroke-width="${w}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${C.m}" stroke-width="${i}" stroke-linecap="round"/>`;
const ear=(cx,cy,rx,ry)=>`<g class="ear"><g transform="rotate(-10 ${cx} ${cy})"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${C.m}" stroke="${C.o}" stroke-width="4"/><ellipse cx="${cx-2}" cy="${cy+2}" rx="${rx*.6}" ry="${ry*.62}" fill="${C.ck}" opacity=".5"/></g></g>`;
const eye=(x,y,r)=>`<g class="eye"><circle cx="${x}" cy="${y}" r="${r}" fill="${C.o}"/><circle cx="${x-r*.33}" cy="${y-r*.35}" r="${r*.35}" fill="#fff"/></g>`;
const leg=(x,y,h,f)=>`<rect x="${x}" y="${y}" width="20" height="${h}" rx="9" fill="${f}" stroke="${C.o}" stroke-width="4"/><path d="M${x+5} ${y+h-6}h10" stroke="${C.lt}" stroke-width="2.5" stroke-linecap="round"/>`;
const T_UP='M48 38C60 42 68 34 66 22C65 16 61 14 58 17';
const head=(trunk=true)=>`<circle cx="30" cy="32" r="24" fill="${C.m}" stroke="${C.o}" stroke-width="4"/>`
  +(trunk?`<g class="trunk">${tube(T_UP,14,7)}<ellipse cx="47" cy="37" rx="5" ry="6" fill="${C.m}"/></g>`:'')
  +ear(20,34,13,17)+eye(40,26,3.6)+`<ellipse cx="43" cy="40" rx="4.5" ry="3" fill="${C.ck}" opacity=".8"/>`;
const body=()=>`<g class="far">${leg(64,108,32,C.dk)}${leg(116,108,32,C.dk)}</g>
  <path d="M38 92q-12 6-8 20" fill="none" stroke="${C.o}" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="88" cy="96" rx="52" ry="38" fill="${C.m}" stroke="${C.o}" stroke-width="4"/>
  <g class="near">${leg(48,112,30,C.m)}${leg(100,112,30,C.m)}</g>
  <circle cx="136" cy="70" r="36" fill="${C.m}" stroke="${C.o}" stroke-width="4"/>
  <g class="tup">${tube('M164 80C182 86 194 72 192 56C191 47 185 43 180 47',17,10)}</g>
  <g class="tdown">${tube('M164 84C180 94 184 130 182 205',17,10)}<rect x="176" y="200" width="12" height="20" rx="2" fill="${C.lt}" stroke="${C.o}" stroke-width="3"/><path d="M176 219L182 231L188 219Z" fill="${C.o}"/></g>
  <ellipse cx="163" cy="80" rx="7" ry="8" fill="${C.m}"/>${ear(122,74,19,24)}${eye(152,62,4.5)}
  <ellipse cx="156" cy="84" rx="7" ry="4.5" fill="${C.ck}" opacity=".75"/><path d="M155 94q5 4 10 0" fill="none" stroke="${C.o}" stroke-width="2.5" stroke-linecap="round"/>`;

// ---- Text geometry: a hidden mirror of the field (same font, padding, width, wrapping) gives exact token positions.
const MIR=document.createElement('div');document.body.appendChild(MIR);
const isTA=()=>box.tagName==='TEXTAREA';
function measure(text,unit='word'){const cs=getComputedStyle(box),ta=isTA();
  MIR.style.cssText=`position:absolute;visibility:hidden;left:-9999px;top:0;box-sizing:border-box;width:${box.offsetWidth}px;font:${cs.font};letter-spacing:${cs.letterSpacing};`
   +`padding:${ta?cs.padding:'0 '+cs.paddingRight+' 0 '+cs.paddingLeft};border:${cs.borderTopWidth} solid transparent;white-space:${ta?'pre-wrap':'pre'};overflow-wrap:break-word;line-height:${ta?cs.lineHeight:box.clientHeight+'px'}`;
  const parts=unit==='char'?[...text]:unit==='none'?[text]:(text.match(/\s+|\S+\s*/g)||[]);
  MIR.textContent='';for(const t of parts){const sp=document.createElement('span');sp.textContent=t;MIR.appendChild(sp)}
  const end=document.createElement('span');end.textContent='​';MIR.appendChild(end);
  const bl=parseFloat(cs.borderLeftWidth),bt=parseFloat(cs.borderTopWidth),ox=box.offsetLeft+bl,oy=box.offsetTop+bt,cw=box.clientWidth,ch=box.clientHeight;
  const toks=parts.map((t,i)=>{const sp=MIR.children[i];const x=ox+sp.offsetLeft,y=oy+sp.offsetTop,w=sp.offsetWidth,h=sp.offsetHeight;
    return{t,i,x,y,w,h,vis:x+w<=ox+cw-2&&y+h<=oy+ch+1}});
  return{toks,end:{x:ox+end.offsetLeft,y:oy+end.offsetTop,h:end.offsetHeight},box:{x:ox,y:oy,w:cw,h:ch}}}
function caretXY(s=box.value){const m=measure(s,'none').end;
  return{x:Math.max(16,Math.min(m.x-box.scrollLeft,box.offsetWidth-16)),y:Math.min(m.y+m.h/2-box.scrollTop,box.offsetHeight-12)}}
const caretX=s=>caretXY(s).x, caretY=s=>caretXY(s).y;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Lifecycle: S = everything the mounted variant owns (rAF loops, DOM); ST = timers owned by the current state.
let S={r:[],els:[]},ST=[];
function newScope(){S.r.forEach(h=>h.stop=true);S.els.forEach(e=>e.remove());S={r:[],els:[]}}
const later=(f,ms)=>{ST.push(setTimeout(f,ms))};
const frame=f=>{const h={stop:false};S.r.push(h);const k=t=>{if(h.stop)return;f(t);requestAnimationFrame(k)};requestAnimationFrame(k)};
const own=cls=>{const e=document.createElement('div');e.className=cls;wrap.appendChild(e);S.els.push(e);return e};
const replay=(el,cls)=>{el.classList.remove(cls);void el.getBoundingClientRect();el.classList.add(cls)};
// Compact head for D-K: same Gopu head, mirrored so it faces the text field. Parts: .hd .tr .ear .eye .pupil
const MW=84,MH=68;
const miniSVG=(size,{tx=''}={})=>`<svg width="${size}" viewBox="0 0 ${MW} ${MH}" style="overflow:visible;display:block"><g transform="translate(${MW} 0) scale(-1 1)"><g class="hd">
  <circle cx="30" cy="32" r="24" fill="${C.m}" stroke="${C.o}" stroke-width="4"/>
  <g class="tr"><path class="tro" d="${T_UP}" fill="none" stroke="${C.o}" stroke-width="14" stroke-linecap="round"/><path class="tri" d="${T_UP}" fill="none" stroke="${C.m}" stroke-width="7" stroke-linecap="round"/>${tx}</g>
  <ellipse cx="47" cy="37" rx="5" ry="6" fill="${C.m}"/>${ear(20,34,13,17)}
  <g class="eye"><g class="pupil"><circle cx="40" cy="26" r="3.6" fill="${C.o}"/><circle cx="38.8" cy="24.7" r="1.25" fill="#fff"/></g></g>
  <ellipse cx="43" cy="40" rx="4.5" ry="3" fill="${C.ck}" opacity=".8"/></g></g></svg>`;
const sparkle=(x,y)=>fx('✦',x,y,{dy:-12,dx:4,dur:520,color:C.m,size:11});
function fx(t,x,y,{dx=0,dy=-30,dur=900,color=C.dk,size=14}={}){if(RM)return;const s=document.createElement('span');s.className='fx';s.textContent=t;Object.assign(s.style,{left:x+'px',top:y+'px',color,fontSize:size+'px'});wrap.appendChild(s);
  s.animate([{transform:'translate(-50%,-50%) scale(.5)',opacity:0},{opacity:1,offset:.2},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1)`,opacity:0}],{duration:dur,easing:'ease-out'}).onfinish=()=>s.remove();}
let loops=[];const every=(f,ms)=>{if(!RM)loops.push(setInterval(f,ms))};

// ================= shared: timing + full-body rig =================
let SLOW=1;const T=ms=>ms*SLOW;
const ease={out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,back:t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}};
// one-shot rAF tween, owned by the variant scope so switching variants stops it
const tween=(ms,fn,ez=t=>t)=>new Promise(res=>{if(RM||ms<=0){fn(1);return res()}const t0=performance.now(),h={stop:false};S.r.push(h);
  const k=t=>{if(h.stop)return res();const p=Math.min(1,(t-t0)/ms);fn(ez(p));p<1?requestAnimationFrame(k):res()};requestAnimationFrame(k)});
// Full-body side-view Gopu standing on a ground line (default: the field's top border), with a live (spring) trunk that can reach any point.
const bodyRig=()=>`<g class="far">${leg(64,108,32,C.dk)}${leg(116,108,32,C.dk)}</g>
  <path d="M38 92q-12 6-8 20" fill="none" stroke="${C.o}" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="88" cy="96" rx="52" ry="38" fill="${C.m}" stroke="${C.o}" stroke-width="4"/>
  <g class="near">${leg(48,112,30,C.m)}${leg(100,112,30,C.m)}</g>
  <circle cx="136" cy="70" r="36" fill="${C.m}" stroke="${C.o}" stroke-width="4"/>${ear(122,74,19,24)}
  <g class="eye"><g class="pupil"><circle cx="152" cy="62" r="4.5" fill="${C.o}"/><circle cx="150.5" cy="60.4" r="1.6" fill="#fff"/></g></g>
  <ellipse class="ck" cx="156" cy="84" rx="7" ry="4.5" fill="${C.ck}" opacity=".75"/><path d="M155 94q5 4 10 0" fill="none" stroke="${C.o}" stroke-width="2.5" stroke-linecap="round"/>`;
const textStartX=()=>{const cs=getComputedStyle(box);return box.offsetLeft+parseFloat(cs.borderLeftWidth)+parseFloat(cs.paddingLeft)};
function makeRig({W=60,x=null,y=0,flip=false}={}){
  const s=W/210,f=flip?-1:1,el=own('rig hide');
  el.innerHTML=`<svg width="${W}" viewBox="0 -20 210 180" style="overflow:visible;display:block">${flip?`<g transform="translate(210 0) scale(-1 1)">${bodyRig()}</g>`:bodyRig()}</svg>`;
  const tk=own('trk');tk.innerHTML=`<svg width="1" height="1" style="overflow:visible;display:block;position:absolute"><path class="to" fill="none" stroke="${C.o}" stroke-width="${(17*s).toFixed(2)}" stroke-linecap="round"/><path class="ti" fill="none" stroke="${C.m}" stroke-width="${(10*s).toFixed(2)}" stroke-linecap="round"/><circle class="mo" r="${(3.4*s).toFixed(2)}" fill="${C.o}" opacity="0"/></svg>`;
  // default perch: top-left corner, trunk root just left of where the text starts
  const base=x??(textStartX()+3-164*s),top=y-160*s,O={x:(flip?115:95)*s,y:160*s};
  const r={s,W,el,f,base,top,p:{x:0,lift:0,rot:0,sx:1,sy:1},g:{x:0,lift:0,rot:0,sx:1,sy:1},tip:null,v:{x:0,y:0},goal:null,show:false,clip:false,trunkOn:true,
    to:tk.querySelector('.to'),ti:tk.querySelector('.ti'),mo:tk.querySelector('.mo'),
    xf(lx,ly){const p=this.p,vx=(lx-O.x)*p.sx,vy=(ly-O.y)*p.sy,a=p.rot*Math.PI/180;return{x:this.base+p.x+O.x+vx*Math.cos(a)-vy*Math.sin(a),y:this.top+p.lift+O.y+vx*Math.sin(a)+vy*Math.cos(a)}},
    root(){return this.xf((flip?46:164)*s,102*s)},
    rest(t){const R=this.root();return{x:R.x+f*7,y:R.y-10+Math.sin(t/700)*.8}},
    cls(c){el.className='rig'+(this.show?'':' hide')+(c?' '+c:'')},
    pose(o){Object.assign(this.g,o)},jump(o){Object.assign(this.g,o);Object.assign(this.p,o)}};
  r.cls('');Object.assign(el.style,{left:base+'px',top:top+'px',transformOrigin:`${O.x}px ${O.y}px`});
  frame(t=>{const k=RM?1:.2/SLOW;for(const n in r.g)r.p[n]+=(r.g[n]-r.p[n])*k;const p=r.p;
    el.style.transform=`translate(${p.x.toFixed(2)}px,${p.lift.toFixed(2)}px) rotate(${p.rot.toFixed(2)}deg) scale(${p.sx.toFixed(3)},${p.sy.toFixed(3)})`;
    el.style.clipPath=r.clip?`inset(-40px -40px ${(20*s+p.lift).toFixed(1)}px -40px)`:'';   // when diving, only the part above the top border shows
    const G=r.goal?r.goal(t):r.rest(t);if(!r.tip)r.tip={...G};
    if(RM)r.tip={...G};else{const ks=.16/SLOW;r.v.x=(r.v.x+(G.x-r.tip.x)*ks)*.7;r.v.y=(r.v.y+(G.y-r.tip.y)*ks)*.7;r.tip.x+=r.v.x;r.tip.y+=r.v.y}
    const R=r.root(),Tp=r.tip,dx=Tp.x-R.x;

async function press(){if(busy||state!=='focused')return;busy=true;const orig=box.value,draft=orig.trim(),v=V[key];
  mode=!draft?'reply (empty box)':/^(translate|make|write|turn|summari[sz]e)/i.test(draft)?'instruction':'polish draft';const m=mode.split(' ')[0];
  let out=null;
  try{status('thinking',m);setState('thinking');await sleep(T(+$('think').value));
    if($('fail').checked){$('fail').checked=false;setState('error');status('error',m);await sleep(T(1700));box.value=orig;return}
    out=pickOutput(m,draft);setState('writing');status('writing',m);
    while(box.value){box.value=box.value.slice(0,-1);v.follow(caretX());await sleep(T(14))}
    for(const ch of out){const commit=c=>{box.value+=c;box.scrollLeft=box.scrollWidth;box.scrollTop=box.scrollHeight;v.follow(caretX());show()};v.onChar?v.onChar(ch,commit):commit(ch);await sleep(T(42))}
    await sleep(T(v.tail||0));
    box.value=out;if(document.activeElement===box)box.setSelectionRange(out.length,out.length);
    setState('done');status('done',m,orig,out);await sleep(T(1600));
  }catch(e){console.error(e);box.value=out??orig}          // a broken animation must never leave half-written text
  finally{status('off');busy=false;setState(document.activeElement===box?'focused':'idle')}}

// ---- field + inputs
function bindBox(){box.addEventListener('focus',()=>{if(!busy)setState('focused')});box.addEventListener('blur',()=>{if(!busy)setState('idle')});
  box.addEventListener('input',()=>{if(state==='focused')V[key].retype?.();show()})}
function setField(multi){if(busy)return;const el=document.createElement(multi?'textarea':'input');el.id='box';el.placeholder='Message Maya…';el.autocomplete='off';
  el.value=multi?box.value:box.value.replace(/\n+/g,' ');box.replaceWith(el);box=el;bindBox();$('f1').classList.toggle('on',!multi);$('f2').classList.toggle('on',multi);mount(key)}
bindBox();$('f1').classList.add('on');
$('f1').onmousedown=e=>{e.preventDefault();setField(false)};$('f2').onmousedown=e=>{e.preventDefault();setField(true)};
SAMPLES.forEach((t,i)=>$('s'+i).onmousedown=e=>{e.preventDefault();if(busy)return;box.value=isTA()?t:t.replace(/\n+/g,' ');box.focus();box.setSelectionRange(box.value.length,box.value.length);if(state==='focused')V[key].retype?.();show()});
$('slow').onchange=e=>{SLOW=e.target.checked?4:1};
$('stat').onchange=e=>{wrap.classList.toggle('has-status',e.target.checked)};wrap.classList.add('has-status');
$('key').addEventListener('mousedown',e=>{e.preventDefault();if(document.activeElement!==box)box.focus();press()});
let solo=false;addEventListener('keydown',e=>{solo=e.code==='ControlRight';if(document.activeElement!==box&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))cycle(e.key==='ArrowRight'?1:-1)});
addEventListener('keyup',e=>{if(e.code==='ControlRight'&&solo)press();solo=false});
const keys=Object.keys(V);const cycle=d=>{if(!busy)mount(keys[(keys.indexOf(key)+d+keys.length)%keys.length])};
$('pills').innerHTML=keys.map(k=>`<button class="p">${k}</button>`).join('');
$('pills').querySelectorAll('.p').forEach(b=>b.onmousedown=e=>{e.preventDefault();if(!busy)mount(b.textContent)});
$('prev').onmousedown=e=>{e.preventDefault();cycle(-1)};$('next').onmousedown=e=>{e.preventDefault();cycle(1)};
mount(key);
</script></body></html>
