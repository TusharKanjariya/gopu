<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Introduce yourself</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f1ee;font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:#1f1f1f}
  .card{width:min(640px,92vw);background:#fff;border:1px solid #e4e0da;border-radius:14px;padding:28px 32px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  .from{display:flex;gap:12px;align-items:center;margin-bottom:18px}
  .av{width:40px;height:40px;border-radius:50%;background:#3b6ea5;color:#fff;display:grid;place-items:center;font-weight:600}
  .from b{display:block}.from small{color:#6b6b6b}
  .msg{background:#f6f5f3;border-radius:10px;padding:12px 14px;margin:0 0 22px}
  label{display:block;font-weight:600;margin-bottom:8px}
  textarea{width:100%;min-height:150px;padding:12px 14px;font:inherit;border:1px solid #cfcac3;border-radius:10px;resize:vertical}
  textarea:focus{outline:2px solid #E8891C;outline-offset:-1px;border-color:transparent}
  .row{display:flex;justify-content:flex-end;margin-top:14px}
  button{font:inherit;font-weight:600;padding:9px 20px;border:0;border-radius:8px;background:#1f1f1f;color:#fff;cursor:pointer}
</style></head><body>
<main class="card">
  <div class="from"><div class="av" aria-hidden="true">P</div><div><b>Priya · Team lead</b><small>#welcome · just now</small></div></div>
  <p class="msg">Welcome aboard! 👋 Before Monday's kickoff, could you introduce yourself to the team? Who you are,
    what you work on, and one thing you're great at.</p>
  <label for="intro">Who am I?</label>
  <textarea id="intro" aria-label="Who am I?" placeholder="Write your introduction…" autofocus></textarea>
  <div class="row"><button type="button">Post</button></div>
</main>
</body></html>
