<!doctype html>
<!-- Settings window mockups (settings-v1 ticket 01). Three directions for the same Provider screen. Throwaway. -->
<html><head><meta charset="utf-8"><title>Gopu settings mockups</title><style>
  body{margin:0;padding:28px;background:#d9d4ce;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;gap:34px;align-items:center}
  h2{margin:0 0 10px;font:600 15px 'Segoe UI';color:#2B170A}
  .win{width:760px;height:500px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 40px #0003}
  .bar{height:32px;display:flex;align-items:center;padding:0 12px;font-size:12px;gap:8px}
  .bar img{width:16px}.bar .x{margin-left:auto;letter-spacing:18px}
  .body{flex:1;display:flex;min-height:0}
  .side{width:180px;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
  .side .it{padding:8px 12px;border-radius:7px;font-size:13px;display:flex;gap:10px;align-items:center}
  .side .foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:11px;padding:0 8px}
  .side .foot img{width:34px}
  .main{flex:1;padding:22px 28px;overflow:hidden}
  .main h1{margin:0 0 4px;font:600 20px 'Segoe UI'}
  .sub{font-size:12.5px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
  .card{border-radius:9px;padding:10px 12px;font-size:13px;font-weight:600}
  .card small{display:block;font-weight:400;font-size:11px;margin-top:2px}
  label{display:block;font-size:12px;font-weight:600;margin:0 0 5px}
  .in{border-radius:7px;padding:8px 10px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between}
  .row{display:flex;gap:12px}.row>div{flex:1}
  .acts{display:flex;align-items:center;gap:12px;margin-top:4px}
  .btn{border-radius:7px;padding:8px 16px;font-size:13px;font-weight:600}
  .ok{font-size:12px}

  /* A: warm light */
  .A{background:#FFFBF5;color:#2B170A}.A .bar{background:#FFF3E3}.A .side{background:#FFF3E3}
  .A .it.on{background:#fff;box-shadow:0 1px 3px #b2600b22;color:#B2600B;font-weight:600}
  .A .sub,.A small,.A .foot{color:#8a6c55}
  .A .card{background:#fff;border:1px solid #efdfca}.A .card.on{border:2px solid #E8891C;background:#FFF6EA;padding:9px 11px}
  .A .in{background:#fff;border:1px solid #e6d5bf}.A .btn.p{background:#E8891C;color:#fff}.A .btn.s{border:1px solid #e6d5bf;background:#fff}
  .A .ok{color:#3c8a3f}

  /* B: warm dark */
  .B{background:#1F1915;color:#F3E9DE}.B .bar{background:#171310}.B .side{background:#171310}
  .B .it{color:#bfae9d}.B .it.on{background:#2C231D;color:#FFB45C;font-weight:600}
  .B .sub,.B small,.B .foot{color:#9c8a79}
  .B .card{background:#2A221C;border:1px solid #3a2f27}.B .card.on{border:2px solid #E8891C;background:#33261b;padding:9px 11px}
  .B .in{background:#2A221C;border:1px solid #3a2f27}.B .btn.p{background:#E8891C;color:#1F1915}.B .btn.s{border:1px solid #3a2f27}
  .B .ok{color:#7fcf83}

  /* C: Windows-native neutral, saffron only as accent */
  .C{background:#F3F3F3;color:#1b1b1b}.C .bar{background:#F3F3F3}.C .side{background:#F3F3F3}
  .C .it{position:relative}.C .it.on{background:#e9e9e9;font-weight:600}
  .C .it.on::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:#E8891C}
  .C .main{background:#fff;border-radius:8px 0 0 0;border:1px solid #e5e5e5}
  .C .sub,.C small,.C .foot{color:#616161}
  .C .card{background:#fbfbfb;border:1px solid #e5e5e5;border-radius:6px}.C .card.on{border:2px solid #E8891C;padding:9px 11px}
  .C .in{background:#fff;border:1px solid #d6d6d6;border-bottom:2px solid #E8891C;border-radius:4px}
  .C .btn{border-radius:4px}.C .btn.p{background:#B2600B;color:#fff}.C .btn.s{border:1px solid #d6d6d6;background:#fff}
  .C .ok{color:#107c10}
</style></head><body>
<script>
const providers=[['Groq','Free tier, fast'],['OpenAI','Your key'],['Anthropic','Your key'],['OpenRouter','Many models'],['Ollama','Local, private'],['Custom','Any OpenAI-style URL']];
const win=(cls,title)=>`<div><h2>${title}</h2><div class="win ${cls}">
<div class="bar"><img src="../assets/mascot/gopu-glyph.svg">Gopu settings<span class="x">–▢✕</span></div>
<div class="body"><div class="side">
 <div class="it on">◈ Model</div><div class="it">☺ You</div><div class="it">⌨ Gopu key</div><div class="it">ⓘ About</div>
 <div class="foot"><img src="../assets/mascot/gopu-glyph.svg">Gopu 0.1</div></div>
<div class="main"><h1>Model</h1><div class="sub">Pick who writes for Gopu. Your key stays on this computer.</div>
 <div class="grid">${providers.map(([n,s],i)=>`<div class="card${i==1?' on':''}">${n}<small>${s}</small></div>`).join('')}</div>
 <label>API key</label><div class="in"><span>sk-••••••••••••••••••••3f9a</span><span>Show</span></div>
 <div class="row"><div><label>Model</label><div class="in"><span>gpt-5-mini</span><span>▾</span></div></div>
 <div><label>Thinking</label><div class="in"><span>Medium</span><span>▾</span></div></div></div>
 <div class="acts"><div class="btn p">Save</div><div class="btn s">Test</div><span class="ok">✓ Connected, answered in 420 ms</span></div>
</div></div></div></div>`;
document.body.innerHTML=win('A','A · Warm light')+win('B','B · Warm dark')+win('C','C · Windows native, saffron accent');
</script>
</body></html>
